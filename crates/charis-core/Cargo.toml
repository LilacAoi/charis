[package]
name = "charis-core"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli"] }
encoding_rs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }

