<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#2D3748"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Icon Background (Rounded Squircle) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#718096" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Giko Character Group with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Tail (Left side: ～) -->
    <path d="M 120 400 C 90 400, 70 380, 80 355 C 90 330, 125 340, 135 375" 
          fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>

    <!-- Body & Legs: (＿__ﾉ -->
    <path d="M 195 320 L 195 410 C 195 435, 340 435, 340 405 L 340 320" 
          fill="#FFFFFF" stroke="#1A202C" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Arm / Chest: /  | -->
    <path d="M 215 320 L 205 385" stroke="#1A202C" stroke-width="10" stroke-linecap="round"/>
    <path d="M 320 320 L 320 385" stroke="#1A202C" stroke-width="10" stroke-linecap="round"/>

    <!-- Left Ear (∧) -->
    <polygon points="175,180 205,80 250,165" fill="#FFFFFF" stroke="#1A202C" stroke-width="12" stroke-linejoin="round"/>
    <polygon points="188,170 208,105 238,162" fill="#FEB2B2"/>

    <!-- Right Ear (∧) -->
    <polygon points="275,165 320,80 350,180" fill="#FFFFFF" stroke="#1A202C" stroke-width="12" stroke-linejoin="round"/>
    <polygon points="287,162 317,105 337,170" fill="#FEB2B2"/>

    <!-- Head Outline -->
    <ellipse cx="262" cy="235" rx="105" ry="90" fill="#FFFFFF" stroke="#1A202C" stroke-width="12"/>

    <!-- Eyes and Eyebrows (Slanted angry eyes ,,) -->
    <!-- Left eyebrow & eye -->
    <path d="M 190 205 L 225 218" stroke="#1A202C" stroke-width="8" stroke-linecap="round"/>
    <circle cx="218" cy="235" r="9" fill="#1A202C"/>

    <!-- Right eyebrow & eye -->
    <path d="M 335 205 L 300 218" stroke="#1A202C" stroke-width="8" stroke-linecap="round"/>
    <circle cx="307" cy="235" r="9" fill="#1A202C"/>

    <!-- Nose -->
    <polygon points="258,245 267,245 262.5,252" fill="#1A202C"/>

    <!-- Classic Open Fanged Mouth: Д -->
    <path d="M 240 260 C 240 260, 245 295, 262.5 295 C 280 295, 285 260, 285 260 Z" 
          fill="#E53E3E" stroke="#1A202C" stroke-width="8" stroke-linejoin="round"/>
    <!-- Left Fang -->
    <polygon points="245,260 252,260 248,272" fill="#FFFFFF"/>
    <!-- Right Fang -->
    <polygon points="273,260 280,260 277,272" fill="#FFFFFF"/>

    <!-- Whiskers -->
    <path d="M 175 235 L 130 228" stroke="#1A202C" stroke-width="6" stroke-linecap="round"/>
    <path d="M 175 250 L 135 255" stroke="#1A202C" stroke-width="6" stroke-linecap="round"/>

    <path d="M 350 235 L 395 228" stroke="#1A202C" stroke-width="6" stroke-linecap="round"/>
    <path d="M 350 250 L 390 255" stroke="#1A202C" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
